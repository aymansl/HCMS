name: CI

# Builds the solution and runs the tests on every push to main.
# The tests use EF Core InMemory: no database, connection string or secret is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Windows, like the development machine (Visual Studio, case-insensitive view paths).
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HCMS4.sln

      - name: Build (Release, warnings are errors)
        run: dotnet build HCMS4.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test HCMS4.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14
